apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: agents
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS memory (
      id            uuid primary key default gen_random_uuid(),
      namespace     text not null,              -- repo:<name> | org
      content       text not null,
      embedding     vector(768),
      source_ref    text not null,              -- issue/88#c3, pr/41, advisory/GHSA-...
      source_trust  text not null check (source_trust in ('trusted','untrusted','mixed')),
      task_id       text not null,
      writer        text not null,              -- agent identity (SA or SPIFFE)
      acts_for      text not null,
      state         text not null check (state in ('active','quarantined','expired','rejected')),
      created_at    timestamptz not null default now(),
      expires_at    timestamptz not null,
      promoted_by   text
    );

    CREATE INDEX IF NOT EXISTS idx_memory_namespace_state ON memory (namespace, state);
    CREATE INDEX IF NOT EXISTS idx_memory_task_id ON memory (task_id);
    CREATE INDEX IF NOT EXISTS idx_memory_source_ref ON memory (source_ref);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agents
  labels:
    app: postgres
    atp.dev/component: memory-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        atp.dev/component: memory-db
    spec:
      nodeSelector:
        atp.dev/pool: platform
      containers:
        - name: postgres
          image: pgvector/pgvector:pg18
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "atp_memory"
            - name: POSTGRES_USER
              value: "atp_admin"
            - name: POSTGRES_PASSWORD
              value: "atp_memory_secure_pass_2026"
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "trust"
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
            - name: pgdata
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "atp_admin", "-d", "atp_memory"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "atp_admin", "-d", "atp_memory"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-sql
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agents
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
